# On the VPS: docker compose up -d --build   (env in /opt/mabarint/.env)
services:
  web:
    build: .
    restart: unless-stopped
    env_file: /opt/mabarint/.env
    ports:
      - "127.0.0.1:3200:3000"
    volumes:
      - cache:/data/cache
      # Playground history (one JSON line per Annotate click).
      - history:/data/history
volumes:
  cache:
  history:
